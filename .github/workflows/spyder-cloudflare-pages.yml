name: SPYDER Web — Cloudflare Worker

# This file REPLACES the previous Pages deployment workflow at the same path.
# No direct push trigger: production can only deploy after an unpack workflow
# succeeded, or after an explicit manual dispatch.
on:
  workflow_run:
    workflows:
      - 'SPYDER Web — Unpack'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spyder-web-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Cloudflare screenshot confirms the existing Worker is named spider-ac.
      # This is intentionally NOT the domain spyder.ac and NOT spyder-ac.
      SPYDER_WORKER_NAME: spider-ac
      CI: 'true'

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate website before deploy
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pending=(spyder-web-update*.zip)
          if (( ${#pending[@]} != 0 )); then
            echo '::error::An update ZIP is still in main. Run the unpack workflow first.'
            exit 1
          fi
          test -f site/index.html || { echo '::error::site/index.html is missing'; exit 1; }
          test -f scripts/validate_site.py || { echo '::error::scripts/validate_site.py is missing'; exit 1; }
          test -f site/assets/app.js || { echo '::error::site/assets/app.js is missing'; exit 1; }
          python3 scripts/validate_site.py
          node --check site/assets/app.js

      - name: Verify token and diagnose Worker visibility
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo '::error::Both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be defined as repository secrets.'
            exit 1
          fi
          python3 <<'PYCODE'
          import json, os, sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          account = os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token = os.environ['CLOUDFLARE_API_TOKEN'].strip()
          worker = os.environ['SPYDER_WORKER_NAME'].strip()
          if len(account) != 32:
              print('::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character Cloudflare Account ID.')
              sys.exit(1)
          print('Account ID suffix:', account[-6:])
          print('Target Worker:', worker)

          def query(path):
              req = Request('https://api.cloudflare.com/client/v4' + path,
                            headers={'Authorization': 'Bearer ' + token,
                                     'Accept': 'application/json'})
              try:
                  with urlopen(req, timeout=30) as response:
                      status = response.status
                      body = response.read()
              except HTTPError as exc:
                  status = exc.code
                  body = exc.read()
              try:
                  result = json.loads(body)
              except (ValueError, UnicodeError):
                  result = {}
              return status, result

          try:
              status, data = query('/user/tokens/verify')
          except (URLError, TimeoutError) as exc:
              print('::error::Cannot reach Cloudflare API:', exc)
              sys.exit(1)
          if status != 200 or data.get('success') is not True or data.get('result', {}).get('status') != 'active':
              print(f'::error::Cloudflare API token is not active (HTTP {status}).')
              for err in data.get('errors') or []:
                  print('API error', err.get('code'), err.get('message'))
              sys.exit(1)
          print('Cloudflare API token: active.')

          try:
              status, data = query(f'/accounts/{account}/workers/scripts')
          except (URLError, TimeoutError) as exc:
              print('::warning::Worker inventory request failed:', exc)
          else:
              scripts = data.get('result') or []
              if isinstance(scripts, dict):
                  scripts = scripts.get('scripts') or []
              names = [i.get('id') or i.get('name') for i in scripts if isinstance(i, dict)]
              if status == 200 and data.get('success') is True and worker in names:
                  print(f'Worker {worker} is visible to the token.')
              elif status == 200 and data.get('success') is True:
                  # A per-Worker-scoped token can have limited list visibility.
                  # Do not turn an empty list into a false 'Worker does not exist'.
                  print(f'::warning::Worker {worker} is not present in the API list. This is not a definitive existence check.')
                  print('Check the Account ID from Workers & Pages → Account Details, and token role Workers → Editor.')
                  print('Workers returned by this token:', ', '.join(filter(None, names)) or '(none)')
              else:
                  print(f'::warning::Worker inventory returned HTTP {status}; Wrangler will report the deploy authorization result.')
                  for err in data.get('errors') or []:
                      print('API error', err.get('code'), err.get('message'))
          PYCODE

      - name: Prepare Workers Static Assets deployment
        shell: bash
        run: |
          set -euo pipefail
          # Do not publish Pages-only control files as public static assets.
          printf '_headers\n_redirects\n_worker.js\n' > site/.assetsignore
          # This temporary config is created in CI, so no additional ZIP update
          # or repository change is required. Dashboard manages custom domains.
          cat > wrangler.spyder.deploy.json <<'JSON'
          {
            "name": "spider-ac",
            "compatibility_date": "2026-10-31",
            "workers_dev": false,
            "keep_vars": true,
            "assets": {
              "directory": "./site",
              "not_found_handling": "404-page"
            }
          }
          JSON
          python3 -m json.tool wrangler.spyder.deploy.json >/dev/null
          echo 'Prepared asset-only deployment for existing Worker spider-ac.'

      - name: Deploy site to Cloudflare Worker spider-ac
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.spyder.deploy.json
          {
            echo '### SPYDER Web deployed to Cloudflare Workers'
            echo 'Worker: `spider-ac`'
            echo "Commit: \`$(git rev-parse --short HEAD)\`"
            echo 'Custom domains are managed under Worker Settings → Domains & Routes.'
          } >> "$GITHUB_STEP_SUMMARY"
