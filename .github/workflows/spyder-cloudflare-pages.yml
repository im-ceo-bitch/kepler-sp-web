name: SPYDER Web — Cloudflare Worker

# This file REPLACES the previous Pages deployment workflow at the same path.
# No direct push trigger: production can only deploy after an unpack workflow
# succeeded, or after an explicit manual dispatch.
on:
  workflow_run:
    workflows:
      - 'SPYDER Web — Unpack'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spyder-web-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Cloudflare screenshot confirms the existing Worker is named spider-ac.
      # This is intentionally NOT the domain spyder.ac and NOT spyder-ac.
      SPYDER_WORKER_NAME: spider-ac
      CI: 'true'

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate website before deploy
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pending=(spyder-web-update*.zip)
          if (( ${#pending[@]} != 0 )); then
            echo '::error::An update ZIP is still in main. Run the unpack workflow first.'
            exit 1
          fi
          test -f site/index.html || { echo '::error::site/index.html is missing'; exit 1; }
          test -f scripts/validate_site.py || { echo '::error::scripts/validate_site.py is missing'; exit 1; }
          test -f site/assets/app.js || { echo '::error::site/assets/app.js is missing'; exit 1; }
          python3 scripts/validate_site.py
          node --check site/assets/app.js

      - name: Verify existing Worker and token permissions
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo '::error::GitHub Secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required.'
            exit 1
          fi
          python3 <<'PY'
          import json, os, sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          account = os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token = os.environ['CLOUDFLARE_API_TOKEN'].strip()
          name = os.environ['SPYDER_WORKER_NAME'].strip()
          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts'
          request = Request(url, headers={
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/json',
          })
          try:
              with urlopen(request, timeout=30) as response:
                  payload = json.load(response)
                  status = response.status
          except HTTPError as exc:
              status = exc.code
              try:
                  payload = json.loads(exc.read().decode('utf-8'))
              except (ValueError, UnicodeError):
                  payload = {}
          except (URLError, TimeoutError) as exc:
              print(f'::error::Cloudflare API network error: {exc}')
              sys.exit(1)
          if status != 200 or payload.get('success') is not True:
              print(f'::error::Cannot list Cloudflare Workers (HTTP {status}).')
              for item in payload.get('errors', []):
                  print(f'Cloudflare API error {item.get("code", "?")}: {item.get("message", "unknown")}')
              print('Check Account ID and token. A Pages-only token cannot deploy Workers.')
              print('Grant Workers Scripts Edit / Workers Editor on the existing spider-ac Worker.')
              sys.exit(1)
          result = payload.get('result') or []
          if isinstance(result, dict):
              result = result.get('scripts', [])
          names = sorted({item.get('id') or item.get('name') for item in result if isinstance(item, dict)} - {None})
          if name not in names:
              print(f'::error::Worker "{name}" was not found in this Cloudflare account.')
              print('Workers visible to token:', ', '.join(names) or '(none)')
              print('Verify the Worker exists under Workers & Pages and the Account ID is correct.')
              sys.exit(1)
          print(f'Existing Cloudflare Worker verified: {name}')
          PY

      - name: Prepare Workers Static Assets deployment
        shell: bash
        run: |
          set -euo pipefail
          # Do not publish Pages-only control files as public static assets.
          printf '_headers\n_redirects\n_worker.js\n' > site/.assetsignore
          # This temporary config is created in CI, so no additional ZIP update
          # or repository change is required. Dashboard manages custom domains.
          cat > wrangler.spyder.deploy.json <<'JSON'
          {
            "name": "spider-ac",
            "compatibility_date": "2026-10-31",
            "workers_dev": false,
            "keep_vars": true,
            "assets": {
              "directory": "./site",
              "not_found_handling": "404-page"
            }
          }
          JSON
          python3 -m json.tool wrangler.spyder.deploy.json >/dev/null
          echo 'Prepared asset-only deployment for existing Worker spider-ac.'

      - name: Deploy site to Cloudflare Worker spider-ac
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.spyder.deploy.json
          {
            echo '### SPYDER Web deployed to Cloudflare Workers'
            echo 'Worker: `spider-ac`'
            echo "Commit: \`$(git rev-parse --short HEAD)\`"
            echo 'Custom domains are managed under Worker Settings → Domains & Routes.'
          } >> "$GITHUB_STEP_SUMMARY"
