name: SPYDER Web — Unpack

on:
  push:
    branches: [main]
    paths:
      - 'spyder-web-update*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spyder-web-unpack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Locate exactly one update ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          updates=(spyder-web-update*.zip)
          if (( ${#updates[@]} != 1 )); then
            printf 'Expected exactly one spyder-web-update*.zip in repository root; found %d\n' "${#updates[@]}"
            printf 'Found: %s\n' "${updates[*]:-none}"
            exit 1
          fi
          printf 'UPDATE_ZIP=%s\n' "${updates[0]}" >> "$GITHUB_ENV"

      - name: Validate and overlay safe ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path, PurePosixPath
          import os, stat, shutil, tempfile, zipfile

          root = Path.cwd().resolve()
          archive = root / os.environ['UPDATE_ZIP']
          MAX_FILES = 6000
          MAX_BYTES = 120 * 1024 * 1024
          MAX_SINGLE_BYTES = 32 * 1024 * 1024
          SKIP_ROOTS = {'.git', '__MACOSX'}
          SKIP_PATHS = {'.github/workflows'}
          SKIP_NAMES = {'.DS_Store'}

          def safe_parts(name):
              if '\\' in name or '\x00' in name or name.startswith('/'):
                  raise SystemExit(f'Unsafe archive path: {name!r}')
              parts = PurePosixPath(name).parts
              if not parts or any(p in ('.', '..') for p in parts):
                  raise SystemExit(f'Unsafe archive path: {name!r}')
              if ':' in parts[0]:
                  raise SystemExit(f'Invalid archive path: {name!r}')
              return parts

          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()
              if len(members) > MAX_FILES:
                  raise SystemExit('Update has too many entries')
              total = sum(x.file_size for x in members)
              if total > MAX_BYTES or any(x.file_size > MAX_SINGLE_BYTES for x in members):
                  raise SystemExit('Update exceeds size limit')
              candidates = [(info, safe_parts(info.filename)) for info in members]
              # Accept an export wrapper like kepler-sp-web-main/, but never unwrap the real site/ directory.
              top_files = [p for _, p in candidates if len(p) == 1 and not _.is_dir()]
              roots = {p[0] for _, p in candidates}
              unwrap = len(roots) == 1 and not top_files and next(iter(roots)) not in {'site', 'assets', '.github'}
              if unwrap:
                  print('Removing archive wrapper:', next(iter(roots)))
              with tempfile.TemporaryDirectory(prefix='spyder-web-') as tmp:
                  staging = Path(tmp)
                  seen = set()
                  file_count = 0
                  for entry, original in candidates:
                      parts = original[1:] if unwrap else original
                      if not parts:
                          continue
                      rel = PurePosixPath(*parts)
                      relstr = rel.as_posix()
                      if parts[0] in SKIP_ROOTS or parts[-1] in SKIP_NAMES or any(relstr == p or relstr.startswith(p + '/') for p in SKIP_PATHS):
                          print('SKIPPED PROTECTED:', relstr)
                          continue
                      # Keep workflow files separate: the ZIP is content-only.
                      if parts[0] == '.github':
                          print('SKIPPED GITHUB CONFIG:', relstr)
                          continue
                      unix_mode = (entry.external_attr >> 16) & 0xffff
                      if stat.S_ISLNK(unix_mode) or (stat.S_IFMT(unix_mode) not in (0, stat.S_IFREG, stat.S_IFDIR)):
                          raise SystemExit(f'Unsupported ZIP entry type: {relstr}')
                      key = relstr.casefold()
                      if key in seen:
                          raise SystemExit(f'Duplicate ZIP path: {relstr}')
                      seen.add(key)
                      dest = staging.joinpath(*parts)
                      if entry.is_dir():
                          dest.mkdir(parents=True, exist_ok=True)
                          continue
                      file_count += 1
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      with zf.open(entry) as src, dest.open('wb') as dst:
                          shutil.copyfileobj(src,dst)
                  if not file_count:
                      raise SystemExit('No update files to apply')
                  for path in sorted(staging.rglob('*')):
                      rel = path.relative_to(staging)
                      target = root / rel
                      # Don't follow symlinks from the destination repository.
                      if any(p.is_symlink() for p in (target, *target.parents) if p == root or root in p.parents):
                          raise SystemExit(f'Destination symlink not allowed: {rel}')
                      if path.is_dir():
                          target.mkdir(parents=True,exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copy2(path, target)
                  if not (root / 'site/index.html').is_file():
                      raise SystemExit('site/index.html missing after update')
                  print(f'Applied {file_count} files; root site/index.html verified')
          PY

      - name: Commit extracted website and delete update ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -- "$UPDATE_ZIP"
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'deploy: apply SPYDER website ZIP update'
          git push origin HEAD:main
